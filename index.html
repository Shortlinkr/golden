<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Fate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #020105; /* Deepest cosmic dark */
            color: #F8F5F0; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; touch-action: none; user-select: none; 
        }
        
        @keyframes starryDrift {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        #game-container { 
            position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; 
            background: radial-gradient(circle at 50% 50%, #120e1c 0%, #030205 70%, #000000 100%);
            position: relative;
        }

        #game-container::before {
            content: ''; position: absolute; inset: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, rgba(212, 175, 55, 0.8), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 80px 70px, rgba(255, 255, 255, 0.6), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 120px, rgba(212, 175, 55, 0.4), rgba(0,0,0,0));
            background-repeat: repeat; background-size: 200px 200px;
            opacity: 0.3; animation: starryDrift 120s linear infinite; pointer-events: none;
        }

        canvas { 
            background: transparent; 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            border: 1px solid rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.05), inset 0 0 40px rgba(0,0,0,0.8); 
            border-radius: 4px;
        }
        
        .overlay { 
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            background: rgba(2, 1, 4, 0.7); backdrop-filter: blur(12px); 
            z-index: 10; transition: opacity 0.8s ease; 
        }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }
        
        .font-cinzel { font-family: 'Cinzel', serif; }
        
        .text-gold { 
            color: #F4D068; 
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
        }
        .text-red { 
            color: #FF4D4D; 
            text-shadow: 0 0 10px rgba(155, 17, 30, 0.6);
        }

        button { 
            position: relative;
            background: rgba(10, 8, 15, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3); 
            color: #F4D068; 
            letter-spacing: 4px; text-transform: uppercase; 
            cursor: pointer; padding: 16px 48px; 
            font-weight: 400; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 1.15rem; outline: none; 
            font-family: 'Cinzel', serif;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.05), inset 0 0 15px rgba(212, 175, 55, 0.05);
            overflow: hidden;
        }
        button::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transform: rotate(45deg); transition: all 0.5s ease; opacity: 0;
        }
        button:hover { 
            background: rgba(212, 175, 55, 0.1); color: #FFF8E7; 
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(212, 175, 55, 0.2);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        button:hover::after { opacity: 1; transform: rotate(45deg) translate(50%, 50%); }

        #hud { 
            position: absolute; top: 40px; left: 40px; 
            font-size: 1.25rem; font-weight: 300; z-index: 5; pointer-events: none; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .progress-bar-container { 
            width: 240px; height: 1px; background: rgba(255,255,255,0.1); 
            margin-top: 12px; overflow: visible; position: relative;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        #progress-bar { 
            height: 100%; background: #F4D068; width: 0%; 
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 0 10px #F4D068, 0 0 20px #D4AF37;
            position: relative;
        }
        #progress-bar::after {
            content: ''; position: absolute; right: 0; top: -2px; width: 5px; height: 5px;
            background: #FFF; border-radius: 50%; box-shadow: 0 0 10px #FFF, 0 0 20px #D4AF37;
        }
        
        #buffList { 
            margin-top: 18px; font-size: 0.75rem; color: rgba(248, 245, 240, 0.8); 
            text-transform: uppercase; letter-spacing: 2px; 
            display: flex; flex-direction: column; gap: 8px; 
            font-weight: 200;
        }
        
        .touch-zone { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 1; }
        #touch-left { left: 0; }
        #touch-right { right: 0; }
        
        @keyframes slowBreathe {
            0% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 20px rgba(212,175,55,0.3); }
            50% { transform: scale(1.02); opacity: 1; text-shadow: 0 0 40px rgba(212,175,55,0.7), 0 0 10px #fff; }
            100% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 20px rgba(212,175,55,0.3); }
        }
        .spinning-text { animation: slowBreathe 1.5s infinite ease-in-out; }

        .title-glow {
            animation: slowBreathe 4s infinite ease-in-out;
        }

        .dev-item {
            cursor: pointer; padding: 4px 8px; margin-bottom: 4px;
            background: rgba(255,255,255,0.05); transition: background 0.2s;
            font-family: 'Inter', sans-serif; font-size: 0.75rem; text-transform: none; letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 2px;
        }
        .dev-item:hover { background: rgba(255,255,255,0.15); border-color: rgba(212,175,55,0.5); }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1600" height="900"></canvas>
        
        <div id="hud" class="hidden">
            <div class="font-cinzel" style="letter-spacing: 4px; color: rgba(255,255,255,0.6);">SCORE <span id="scoreDisplay" class="text-gold font-semibold ml-3 text-2xl">0</span></div>
            <div class="text-xs mt-5" style="color: rgba(255,255,255,0.5); letter-spacing: 3px; font-weight: 300;">FATE FRAGMENTS</div>
            <div class="progress-bar-container"><div id="progress-bar"></div></div>
            <div id="livesDisplay" class="mt-4 text-sm hidden font-cinzel text-gold" style="letter-spacing: 2px;">LIVES: <span id="livesCount" class="text-white">0</span></div>
            <div id="buffList"></div>
        </div>

        <div id="touch-left" class="touch-zone"></div>
        <div id="touch-right" class="touch-zone"></div>

        <!-- Start Screen -->
        <div id="startScreen" class="overlay">
            <h1 class="text-7xl font-cinzel mb-6 tracking-[0.3em] uppercase text-white title-glow" style="text-shadow: 0 0 30px rgba(212,175,55,0.4);">Golden <span class="text-gold">Fate</span></h1>
            <div class="w-32 h-px mb-12" style="background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.8), transparent);"></div>
            <p class="mb-14 text-gray-300 text-center max-w-lg leading-loose font-light tracking-widest text-sm" style="text-shadow: 0 2px 5px rgba(0,0,0,0.8);">
                Steer with Left/Right or A/D.<br>Gather 5 fragments to spin the Wheel of Fate.<br><span class="text-red opacity-80 mt-2 block">Beware the dark void and red illusions.</span>
            </p>
            <button id="startBtn">Begin Journey</button>
        </div>

        <!-- Wheel of Fate Screen -->
        <div id="wheelScreen" class="overlay hidden">
            <h2 class="text-5xl font-cinzel mb-12 tracking-[0.4em] text-white uppercase pb-6 px-12" style="border-bottom: 1px solid rgba(212, 175, 55, 0.2); text-shadow: 0 0 20px rgba(255,255,255,0.2);">The Wheel Turns</h2>
            <div id="wheelResult" class="text-5xl font-cinzel mb-8 h-20 flex items-center justify-center text-center px-6 text-gold spinning-text" style="letter-spacing: 3px; filter: drop-shadow(0 0 10px rgba(212,175,55,0.5));">Spinning...</div>
            <p id="wheelDesc" class="text-gray-300 mb-14 max-w-lg text-center h-16 font-light tracking-widest text-lg leading-relaxed"></p>
            <button id="resumeBtn" class="hidden">Accept Fate</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay hidden">
            <h2 class="text-6xl font-cinzel mb-8 tracking-[0.4em] uppercase text-white" style="text-shadow: 0 0 30px rgba(255,255,255,0.3);">Cycle Broken</h2>
            <div class="w-24 h-px mb-10" style="background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6), transparent);"></div>
            <p class="text-lg mb-14 text-gray-400 font-light tracking-[0.2em]">FINAL SCORE <span id="finalScore" class="text-gold font-cinzel text-3xl ml-4">0</span></p>
            <button id="restartBtn">Begin Anew</button>
        </div>

        <!-- Dev Menu -->
        <div id="devMenu" class="hidden absolute top-4 right-4 bg-black/90 border border-[#D4AF37] p-3 z-50 w-56 max-h-[90vh] overflow-y-auto rounded shadow-2xl backdrop-blur-md">
            <h3 class="font-cinzel text-gold mb-3 text-center border-b border-[#D4AF37]/30 pb-2 text-sm tracking-widest">Dev Menu</h3>
            <div id="devGodMode" class="dev-item text-white text-center font-bold">Toggle God Mode</div>
            <div id="devScore" class="dev-item text-white text-center">+1000 Score</div>
            <div id="devWheel" class="dev-item text-white text-center">Force Wheel</div>
            <div class="text-[0.65rem] tracking-[2px] text-gray-400 mt-4 mb-2 text-center border-b border-gray-600/30 pb-1">TRIGGER FATES</div>
            <div id="devFatesList" class="flex flex-col"></div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const SFX = {
                eat: new Audio('/sound/eat.mp3'),
                death: new Audio('/sound/death.mp3'),
                wheel_spin: new Audio('/sound/wheel_spin.mp3'),
                buff: new Audio('/sound/buff.mp3'),
                debuff: new Audio('/sound/debuff.mp3'),
                portal_hum1: new Audio('/sound/portal_hum1.mp3'),
                portal_hum2: new Audio('/sound/portal_hum2.mp3'),
                portal_open: new Audio('/sound/portal_open.mp3'),
                portal_close: new Audio('/sound/portal_close.mp3'),
                click: new Audio('/sound/click.mp3'),
                hover: new Audio('/sound/hover.mp3')
            };
            // Set default volume for sound effects
            Object.values(SFX).forEach(audio => audio.volume = 0.5);

            let bgm = null;
            function playMusic() {
                if (!bgm) {
                    // Randomly select between /music/1.mp3 and /music/5.mp3
                    const trackNum = Math.floor(Math.random() * 5) + 1;
                    bgm = new Audio(`/music/${trackNum}.mp3`);
                    bgm.loop = true;
                    bgm.volume = 0.3;
                }
                // Play and catch any autoplay browser errors
                bgm.play().catch((e) => { console.log("Awaiting interaction for BGM.", e); });
            }

            function playSound(name) {
                if(SFX[name]) {
                    SFX[name].currentTime = 0; // reset to allow overlapping repeated sounds
                    SFX[name].play().catch(() => {});
                }
            }

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false }); // Optimization hint
            
            const UI = {
                start: document.getElementById('startScreen'),
                wheel: document.getElementById('wheelScreen'),
                over: document.getElementById('gameOverScreen'),
                hud: document.getElementById('hud'),
                score: document.getElementById('scoreDisplay'),
                finalScore: document.getElementById('finalScore'),
                progress: document.getElementById('progress-bar'),
                wheelResult: document.getElementById('wheelResult'),
                wheelDesc: document.getElementById('wheelDesc'),
                resumeBtn: document.getElementById('resumeBtn'),
                buffList: document.getElementById('buffList'),
                livesDisplay: document.getElementById('livesDisplay'),
                livesCount: document.getElementById('livesCount')
            };

            const GAME_W = 1600; 
            const GAME_H = 900;
            const FOOD_TO_WHEEL = 5;
            
            let state = 'menu'; 
            let score = 0;
            let wheelProgress = 0;
            let activeBuffs = [];
            let frameCount = 0;
            let godMode = false;
            
            const keys = { Left: false, Right: false };
            
            let mods = {};
            
            function resetMods() {
                mods = {
                    speed: 5.5, turnSpeed: 0.07, multiplier: 1, maxFood: 1, 
                    invincibleFrames: 0, lives: 0, shield: false,
                    magnetic: false, clairvoyance: false, reach: false,
                    starlight: false, gluttony: false, tranquility: false,
                    portalMaster: false, goldEchoes: false, etherealTailFrames: 0,
                    drunk: false, inverted: false, fog: false, tremors: false,
                    fleeingFood: false, lethalWalls: false, glitchFrames: 0,
                    thick: false, tailSpikes: false, vertigo: false, anchored: null
                };
                activeBuffs = [];
                updateBuffUI();
            }

            // Entities State
            let snake = { x: GAME_W/2, y: GAME_H/2, a: 0, history: [], length: 30 };
            let food = []; let falseFood = []; let bombs = []; 
            let portals = []; let gravityWells = []; let particles = []; let edgePortals = [];

            const FATES = [
                // 25 BUFFS
                { name: "Serpent's Grace", type: "buff", desc: "Turning speed increased.", apply: () => { mods.turnSpeed *= 1.25; addBuffUI("Enhanced Turning"); } },
                { name: "Golden Aura", type: "buff", desc: "Score yield multiplied.", apply: () => { mods.multiplier++; addBuffUI(`x${mods.multiplier} Multiplier`); } },
                { name: "Abundance", type: "buff", desc: "More fragments manifest.", apply: () => { mods.maxFood++; maintainFood(); addBuffUI("Extra Food"); } },
                { name: "Phantom Form", type: "buff", desc: "Phase through hazards temporarily.", apply: () => { mods.invincibleFrames = 900; } },
                { name: "Second Chance", type: "buff", desc: "A checkpoint saves you from one fatal error.", apply: () => { mods.lives++; updateLivesUI(); } },
                { name: "Magnetic Maw", type: "buff", desc: "Fragments are drawn to you.", apply: () => { mods.magnetic = true; addBuffUI("Magnetism"); } },
                { name: "Time Dilation", type: "buff", desc: "Movement slows, granting precision.", apply: () => { mods.speed = Math.max(3, mods.speed - 1.5); addBuffUI("Precision Control"); } },
                { name: "Ouroboros Shed", type: "buff", desc: "Halves your length safely.", apply: () => { snake.length = Math.max(30, Math.floor(snake.length / 2)); snake.history = snake.history.slice(0, snake.length); addBuffUI("Tail Shed"); } },
                { name: "Golden Apple", type: "buff", desc: "A burst of immediate wealth.", apply: () => { score += 500 * mods.multiplier; updateScoreUI(); } },
                { name: "Vitality", type: "buff", desc: "Grants two additional chances.", apply: () => { mods.lives += 2; updateLivesUI(); } },
                { name: "Clairvoyance", type: "buff", desc: "Illuminates the path to fragments.", apply: () => { mods.clairvoyance = true; addBuffUI("Clairvoyance"); } },
                { name: "Midas Touch", type: "buff", desc: "Hazards transform into fragments.", apply: () => { falseFood.forEach(f => food.push(f)); bombs.forEach(b => food.push({x:b.x,y:b.y,r:12})); falseFood=[]; bombs=[]; addBuffUI("Midas Touch"); } },
                { name: "Momentum", type: "buff", desc: "Speed increases, score multiplier rises.", apply: () => { mods.speed += 1.5; mods.multiplier++; addBuffUI("Momentum"); } },
                { name: "Spectral Tail", type: "buff", desc: "Your body becomes immaterial.", apply: () => { mods.etherealTailFrames = 1200; addBuffUI("Spectral Tail"); } },
                { name: "Purify", type: "buff", desc: "Cleanses the arena of all hazards.", apply: () => { if(portals.length > 0) playSound('portal_close'); falseFood=[]; bombs=[]; gravityWells=[]; portals=[]; addBuffUI("Purify"); } },
                { name: "Extended Reach", type: "buff", desc: "Collect fragments from further away.", apply: () => { mods.reach = true; addBuffUI("Extended Reach"); } },
                { name: "Starlight", type: "buff", desc: "Illuminates the darkness.", apply: () => { mods.starlight = true; addBuffUI("Starlight"); } },
                { name: "Prosperous Winds", type: "buff", desc: "A swarm of fragments appears.", apply: () => { for(let i=0;i<8;i++) food.push({x:getSafeX(),y:getSafeY(),r:12}); } },
                { name: "Divine Shield", type: "buff", desc: "An absolute ward against the next death.", apply: () => { mods.shield = true; addBuffUI("Divine Shield"); } },
                { name: "Gluttony", type: "buff", desc: "Fragments grant triple score, double length.", apply: () => { mods.gluttony = true; addBuffUI("Gluttony"); } },
                { name: "Tranquility", type: "buff", desc: "Movement slows significantly for precise control.", apply: () => { mods.speed = Math.max(2.5, mods.speed - 2); mods.turnSpeed *= 1.2; addBuffUI("Tranquility"); } },
                { name: "Ascended State", type: "buff", desc: "Total invincibility and speed temporarily.", apply: () => { mods.invincibleFrames = 600; mods.speed += 2; addBuffUI("Ascended"); } },
                { name: "Portal Master", type: "buff", desc: "Rifts grant massive points when entered.", apply: () => { mods.portalMaster = true; addBuffUI("Portal Master"); } },
                { name: "Echoes of Gold", type: "buff", desc: "Leaves fragments in your wake.", apply: () => { mods.goldEchoes = true; addBuffUI("Golden Echoes"); } },
                { name: "Harmony", type: "buff", desc: "Stabilizes all erratic conditions.", apply: () => { mods.drunk = false; mods.inverted = false; mods.tremors = false; mods.fog = false; mods.vertigo = false; addBuffUI("Harmony"); } },

                // 25 DEBUFFS
                { name: "Abyssal Pull", type: "debuff", desc: "A gravity well distorts space.", apply: () => spawnGravityWell(0.15) },
                { name: "Shattered Path", type: "debuff", desc: "Lethal static obstacles appear.", apply: () => spawnBombs(5) },
                { name: "Blood Echoes", type: "debuff", desc: "Crimson illusions will sever your path.", apply: () => spawnFalseFood(4) },
                { name: "Void Rifts", type: "debuff", desc: "Unstable portals relocate you instantly.", apply: () => spawnPortals(3) },
                { name: "Drunk Serpent", type: "debuff", desc: "Movement becomes erratic.", apply: () => { mods.drunk = true; } },
                { name: "Inverted Reality", type: "debuff", desc: "Directions are reversed.", apply: () => { mods.inverted = true; } },
                { name: "Haste", type: "debuff", desc: "Uncontrollable speed.", apply: () => { mods.speed += 2.5; } },
                { name: "Sluggish", type: "debuff", desc: "Agility severely reduced.", apply: () => { mods.turnSpeed *= 0.5; } },
                { name: "Blinding Fog", type: "debuff", desc: "Vision is heavily obscured.", apply: () => { mods.fog = true; } },
                { name: "Tremors", type: "debuff", desc: "Reality quakes.", apply: () => { mods.tremors = true; } },
                { name: "Starvation", type: "debuff", desc: "Fragments become scarce.", apply: () => { mods.maxFood = 1; while(food.length>1) food.pop(); } },
                { name: "Phantom Hunger", type: "debuff", desc: "Fragments flee from your presence.", apply: () => { mods.fleeingFood = true; } },
                { name: "Lethal Boundaries", type: "debuff", desc: "The edges of reality become fatal.", apply: () => { mods.lethalWalls = true; } },
                { name: "Temporal Glitch", type: "debuff", desc: "Time stutters.", apply: () => { mods.glitchFrames = 600; } },
                { name: "Curse of Greed", type: "debuff", desc: "Wealth multiplier reset.", apply: () => { mods.multiplier = 1; updateBuffUI(); } },
                { name: "Bloated", type: "debuff", desc: "Your form expands, making evasion harder.", apply: () => { mods.thick = true; } },
                { name: "Black Hole", type: "debuff", desc: "An inescapable pull at the center.", apply: () => { gravityWells.push({ x: GAME_W/2, y: GAME_H/2, r: 400, power: 0.3 }); } },
                { name: "Fragile", type: "debuff", desc: "All extra chances stripped away.", apply: () => { mods.lives = 0; updateLivesUI(); } },
                { name: "Tail Spike", type: "debuff", desc: "Your tail sheds hazards.", apply: () => { mods.tailSpikes = true; } },
                { name: "Vertigo", type: "debuff", desc: "The world spins.", apply: () => { mods.vertigo = true; } },
                { name: "Ethereal Chains", type: "debuff", desc: "Movement is anchored to this spot.", apply: () => { mods.anchored = {x: snake.x, y: snake.y}; } },
                { name: "False Hope", type: "debuff", desc: "Fate fragment progress shattered.", apply: () => { wheelProgress = 0; updateScoreUI(); } },
                { name: "Sudden Death", type: "debuff", desc: "Purges all positive effects.", apply: () => { mods.invincibleFrames=0; mods.shield=false; mods.etherealTailFrames=0; } },
                { name: "The Swarm", type: "debuff", desc: "Illusions flood the arena.", apply: () => spawnFalseFood(10) },
                { name: "Growth Spurt", type: "debuff", desc: "Your form lengthens dangerously.", apply: () => { snake.length += 150; } }
            ];

            function spawnGravityWell(pow) { gravityWells.push({ x: getSafeX(), y: getSafeY(), r: 250, power: pow }); }
            function spawnBombs(count) { for(let i=0; i<count; i++) bombs.push({ x: getSafeX(), y: getSafeY(), r: 20 }); }
            function spawnFalseFood(count) { for(let i=0; i<count; i++) falseFood.push({ x: getSafeX(), y: getSafeY(), r: 12 }); }
            function spawnPortals(count) { 
                playSound('portal_open');
                for(let i=0; i<count; i++) {
                    portals.push({ in: { x: getSafeX(), y: getSafeY(), r: 25 }, out: { x: getSafeX(), y: getSafeY(), r: 25 } });
                }
            }

            function getSafeX() { return 150 + Math.random() * (GAME_W - 300); }
            function getSafeY() { return 150 + Math.random() * (GAME_H - 300); }
            function maintainFood() { while(food.length < mods.maxFood) food.push({ x: getSafeX(), y: getSafeY(), r: 12 }); }

            function spawnParticles(x, y, isGold = false) {
                for(let i=0; i<25; i++) {
                    particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 12,
                        vy: (Math.random() - 0.5) * 12,
                        life: 1.0,
                        color: (isGold || Math.random() > 0.4) ? '#F4D068' : '#FFFFFF'
                    });
                }
            }

            function initGame(isMenuAI = false) {
                resetMods();
                snake = { x: GAME_W/2, y: GAME_H/2, a: Math.random() * Math.PI * 2, history: [], length: 30 };
                food = []; falseFood = []; bombs = []; portals = []; gravityWells = []; particles = []; edgePortals = [];
                score = 0; wheelProgress = 0;
                
                maintainFood();
                updateScoreUI();
                
                if(!isMenuAI) {
                    state = 'playing';
                    UI.start.classList.add('hidden');
                    UI.over.classList.add('hidden');
                    UI.hud.classList.remove('hidden');
                } else {
                    state = 'menu';
                }
            }

            window.addEventListener('keydown', e => {
                if(e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.Left = true;
                if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.Right = true;
            });
            window.addEventListener('keyup', e => {
                if(e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.Left = false;
                if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.Right = false;
            });

            const bindTouch = (id, key) => {
                const el = document.getElementById(id);
                const press = (e) => { e.preventDefault(); keys[key] = true; };
                const release = (e) => { e.preventDefault(); keys[key] = false; };
                el.addEventListener('touchstart', press, {passive: false}); el.addEventListener('mousedown', press);
                el.addEventListener('touchend', release); el.addEventListener('mouseup', release); el.addEventListener('mouseleave', release);
            };
            bindTouch('touch-left', 'Left'); bindTouch('touch-right', 'Right');

            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('mouseenter', () => playSound('hover'));
                btn.addEventListener('click', () => playSound('click'));
            });

            document.getElementById('startBtn').addEventListener('click', () => { playMusic(); initGame(false); });
            document.getElementById('restartBtn').addEventListener('click', () => initGame(false));
            UI.resumeBtn.addEventListener('click', () => {
                UI.wheel.classList.add('hidden');
                keys.Left = keys.Right = false; 
                state = 'playing';
            });

            // --- DEV MENU LOGIC ---
            const devMenuUI = document.getElementById('devMenu');
            function checkDevMode() {
                if (window.location.hash.includes('developer')) {
                    devMenuUI.classList.remove('hidden');
                    populateDevFates();
                } else {
                    devMenuUI.classList.add('hidden');
                }
            }
            
            function populateDevFates() {
                const list = document.getElementById('devFatesList');
                if(list.children.length > 0) return; 
                FATES.forEach(f => {
                    let btn = document.createElement('div');
                    btn.className = 'dev-item ' + (f.type === 'buff' ? 'text-[#F4D068]' : 'text-[#FF4D4D]');
                    btn.textContent = f.name;
                    btn.onclick = () => { if(state === 'playing') f.apply(); };
                    list.appendChild(btn);
                });
            }

            document.getElementById('devScore').addEventListener('click', () => { if(state === 'playing') { score += 1000; updateScoreUI(); }});
            document.getElementById('devWheel').addEventListener('click', () => { if(state === 'playing') triggerWheel(); });
            document.getElementById('devGodMode').addEventListener('click', (e) => { 
                godMode = !godMode; 
                e.target.style.color = godMode ? '#00FF00' : '#FFFFFF'; 
                e.target.textContent = godMode ? 'God Mode: ON' : 'Toggle God Mode';
            });

            window.addEventListener('hashchange', checkDevMode);
            checkDevMode();
            // ----------------------

            function triggerWheel() {
                state = 'wheel';
                wheelProgress = 0; updateScoreUI();
                UI.wheel.classList.remove('hidden'); UI.resumeBtn.classList.add('hidden');
                UI.wheelResult.textContent = "Spinning..."; UI.wheelDesc.textContent = "";
                UI.wheelResult.className = "text-5xl font-cinzel mb-8 h-20 flex items-center justify-center text-center px-6 text-white spinning-text";

                playSound('wheel_spin');

                let spins = 0; let maxSpins = 20;
                let interval = setInterval(() => {
                    let randFate = FATES[Math.floor(Math.random() * FATES.length)];
                    UI.wheelResult.textContent = randFate.name;
                    UI.wheelResult.style.color = randFate.type === 'buff' ? '#F4D068' : '#FF4D4D';
                    UI.wheelResult.style.textShadow = randFate.type === 'buff' ? '0 0 20px rgba(212,175,55,0.5)' : '0 0 20px rgba(255,77,77,0.5)';
                    
                    spins++;
                    if(spins >= maxSpins) {
                        clearInterval(interval);
                        let finalFate = FATES[Math.floor(Math.random() * FATES.length)];
                        
                        playSound(finalFate.type === 'buff' ? 'buff' : 'debuff');

                        UI.wheelResult.textContent = finalFate.name;
                        UI.wheelResult.style.color = finalFate.type === 'buff' ? '#F4D068' : '#FF4D4D';
                        UI.wheelResult.style.textShadow = finalFate.type === 'buff' ? '0 0 30px rgba(212,175,55,0.8)' : '0 0 30px rgba(255,77,77,0.8)';
                        UI.wheelResult.classList.remove('spinning-text');
                        
                        UI.wheelDesc.textContent = finalFate.desc;
                        UI.wheelDesc.style.animation = 'slowBreathe 2s ease-in-out forwards';
                        
                        finalFate.apply();
                        UI.resumeBtn.classList.remove('hidden');
                    }
                }, 100);
            }

            function addBuffUI(text) { if(!activeBuffs.includes(text)) { activeBuffs.push(text); updateBuffUI(); } }
            function updateBuffUI() { UI.buffList.innerHTML = activeBuffs.map(b => `<div style="text-shadow: 0 0 8px rgba(255,255,255,0.3);">+ ${b}</div>`).join(''); }
            function updateLivesUI() { 
                if(mods.lives > 0) { UI.livesDisplay.classList.remove('hidden'); UI.livesCount.textContent = mods.lives; } 
                else { UI.livesDisplay.classList.add('hidden'); }
            }
            function updateScoreUI() { UI.score.textContent = score; UI.progress.style.width = `${(wheelProgress / FOOD_TO_WHEEL) * 100}%`; }

            function killPlayer() {
                if(godMode) return;
                if(mods.shield) { mods.shield = false; mods.invincibleFrames = 180; activeBuffs = activeBuffs.filter(b => b !== "Divine Shield"); updateBuffUI(); playSound('buff'); return; }
                if(mods.lives > 0) { mods.lives--; updateLivesUI(); mods.invincibleFrames = 180; playSound('debuff'); return; }
                if(state === 'menu') { initGame(true); } 
                else { playSound('death'); state = 'gameover'; UI.hud.classList.add('hidden'); UI.over.classList.remove('hidden'); UI.finalScore.textContent = score; }
            }

            function updateAI() {
                if(food.length === 0) return;
                let target = food[0]; let minDist = Infinity;
                for(let f of food) {
                    let d = Math.hypot(f.x - snake.x, f.y - snake.y);
                    if(d < minDist) { minDist = d; target = f; }
                }
                let targetAngle = Math.atan2(target.y - snake.y, target.x - snake.x);
                let diff = targetAngle - snake.a;
                while(diff > Math.PI) diff -= Math.PI * 2; while(diff < -Math.PI) diff += Math.PI * 2;
                if(diff > 0.1) snake.a += mods.turnSpeed; else if (diff < -0.1) snake.a -= mods.turnSpeed;
            }

            function update() {
                if (state === 'wheel' || state === 'gameover') return;
                frameCount++;
                if (mods.glitchFrames > 0) { mods.glitchFrames--; if(Math.random() < 0.05) return; } // Temporal Glitch
                
                let effTurn = mods.turnSpeed;

                let left = mods.inverted ? keys.Right : keys.Left;
                let right = mods.inverted ? keys.Left : keys.Right;

                if (state === 'menu') { updateAI(); } 
                else {
                    if (left) snake.a -= effTurn;
                    if (right) snake.a += effTurn;
                    if (mods.drunk) snake.a += Math.sin(frameCount * 0.05) * 0.04;
                }

                if (mods.invincibleFrames > 0) mods.invincibleFrames--;
                if (mods.etherealTailFrames > 0) mods.etherealTailFrames--;
                
                let dx = Math.cos(snake.a) * mods.speed;
                let dy = Math.sin(snake.a) * mods.speed;

                // Gravity Wells & Anchored
                if(mods.anchored) { 
                    dx += (mods.anchored.x - snake.x) * 0.0005; 
                    dy += (mods.anchored.y - snake.y) * 0.0005; 
                }
                for(let gw of gravityWells) {
                    let dist = Math.hypot(gw.x - snake.x, gw.y - snake.y);
                    if(dist < gw.r) {
                        let pullA = Math.atan2(gw.y - snake.y, gw.x - snake.x);
                        let str = (1 - dist/gw.r) * gw.power;
                        dx += Math.cos(pullA) * str * 2.5; dy += Math.sin(pullA) * str * 2.5;
                    }
                }

                snake.x += dx; snake.y += dy;
                snake.a = Math.atan2(dy, dx);

                // Screen Boundaries & Portal Logic
                let wrapped = false; 
                let wrapEntryX = snake.x - dx; let wrapEntryY = snake.y - dy;
                let isVerticalWrap = false;
                let outX = snake.x; let outY = snake.y;
                
                if (snake.x < 0) { if(mods.lethalWalls){killPlayer(); snake.x=0;} else {snake.x += GAME_W; wrapped = true; wrapEntryX = 0; outX = GAME_W; isVerticalWrap = true;} }
                else if (snake.x > GAME_W) { if(mods.lethalWalls){killPlayer(); snake.x=GAME_W;} else {snake.x -= GAME_W; wrapped = true; wrapEntryX = GAME_W; outX = 0; isVerticalWrap = true;} }
                
                if (snake.y < 0) { if(mods.lethalWalls){killPlayer(); snake.y=0;} else {snake.y += GAME_H; wrapped = true; wrapEntryY = 0; outY = GAME_H; isVerticalWrap = false;} }
                else if (snake.y > GAME_H) { if(mods.lethalWalls){killPlayer(); snake.y=GAME_H;} else {snake.y -= GAME_H; wrapped = true; wrapEntryY = GAME_H; outY = 0; isVerticalWrap = false;} }

                if (wrapped) { 
                    spawnParticles(wrapEntryX, wrapEntryY, true); 
                    spawnParticles(outX, outY, true); 
                    edgePortals.push({x: wrapEntryX, y: wrapEntryY, life: 1.0, isVertical: isVerticalWrap});
                    edgePortals.push({x: outX, y: outY, life: 1.0, isVertical: isVerticalWrap});
                }

                snake.history.unshift({ x: snake.x, y: snake.y, wrapped: wrapped });
                if (snake.history.length > snake.length) snake.history.pop();

                // Fates Logic
                if (mods.magnetic) {
                    food.forEach(f => {
                        if(Math.hypot(f.x - snake.x, f.y - snake.y) < 250) {
                            f.x += Math.cos(Math.atan2(snake.y - f.y, snake.x - f.x)) * 3;
                            f.y += Math.sin(Math.atan2(snake.y - f.y, snake.x - f.x)) * 3;
                        }
                    });
                }
                if (mods.fleeingFood) {
                    food.forEach(f => {
                        if(Math.hypot(f.x - snake.x, f.y - snake.y) < 200) {
                            f.x -= Math.cos(Math.atan2(snake.y - f.y, snake.x - f.x)) * 1.5;
                            f.y -= Math.sin(Math.atan2(snake.y - f.y, snake.x - f.x)) * 1.5;
                        }
                    });
                }
                if (mods.tailSpikes && frameCount % 240 === 0 && snake.history.length > 10) {
                    let tail = snake.history[snake.history.length-1];
                    bombs.push({x: tail.x, y: tail.y, r: 20});
                }
                if (mods.goldEchoes && frameCount % 120 === 0 && snake.history.length > 10) {
                    let tail = snake.history[snake.history.length-1];
                    food.push({x: tail.x, y: tail.y, r: 12});
                }

                checkCollisions();
            }

            function checkCollisions() {
                let head = snake.history[0];
                if(!head) return;
                let headRadius = mods.thick ? 22 : 10;
                let foodReach = mods.reach ? headRadius + 30 : headRadius;
                let isInvincible = mods.invincibleFrames > 0;

                // Food
                for (let i = food.length - 1; i >= 0; i--) {
                    let f = food[i];
                    if (Math.hypot(f.x - head.x, f.y - head.y) < f.r + foodReach) {
                        food.splice(i, 1);
                        playSound('eat');
                        snake.length += mods.gluttony ? 16 : 8;
                        if(state === 'playing') {
                            score += (mods.gluttony ? 30 : 10) * mods.multiplier;
                            wheelProgress++;
                            if (wheelProgress >= FOOD_TO_WHEEL) triggerWheel();
                            updateScoreUI();
                        }
                        spawnParticles(f.x, f.y, true); // Flare on eat
                        maintainFood();
                    }
                }

                if(!isInvincible) {
                    for (let i = falseFood.length - 1; i >= 0; i--) {
                        if (Math.hypot(falseFood[i].x - head.x, falseFood[i].y - head.y) < falseFood[i].r + headRadius) {
                            falseFood.splice(i, 1); killPlayer();
                        }
                    }
                    for (let b of bombs) {
                        if (Math.hypot(b.x - head.x, b.y - head.y) < b.r + headRadius - 5) killPlayer();
                    }
                    if(mods.etherealTailFrames <= 0) {
                        for (let i = 20; i < snake.history.length; i++) {
                            let pt = snake.history[i];
                            if (Math.hypot(pt.x - head.x, pt.y - head.y) < headRadius * 1.5) { killPlayer(); break; }
                        }
                    }
                }

                // Portals
                for (let p of portals) {
                    if (Math.hypot(p.in.x - head.x, p.in.y - head.y) < p.in.r + headRadius) {
                        spawnParticles(snake.x, snake.y, true);
                        snake.x = p.out.x; snake.y = p.out.y;
                        playSound(Math.random() > 0.5 ? 'portal_hum1' : 'portal_hum2');
                        snake.history[0].wrapped = true; 
                        spawnParticles(snake.x, snake.y, true);
                        if(mods.portalMaster && state === 'playing') { score += 50 * mods.multiplier; updateScoreUI(); }
                    }
                }

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            function draw() {
                // Background clear
                ctx.fillStyle = '#020105';
                ctx.fillRect(0, 0, GAME_W, GAME_H);

                ctx.save();
                
                if (mods.vertigo) {
                    ctx.translate(GAME_W/2, GAME_H/2);
                    ctx.rotate(Math.sin(frameCount * 0.02) * 0.1);
                    ctx.translate(-GAME_W/2, -GAME_H/2);
                }
                if (mods.tremors) {
                    ctx.translate((Math.random()-0.5)*8, (Math.random()-0.5)*8);
                }

                ctx.globalCompositeOperation = 'lighter'; // Enhances ethereal glow overlaying

                // Draw Environment Voids (Gravity Wells)
                for(let gw of gravityWells) {
                    let grad = ctx.createRadialGradient(gw.x, gw.y, 0, gw.x, gw.y, gw.r);
                    grad.addColorStop(0, 'rgba(10, 0, 25, 0.4)'); 
                    grad.addColorStop(0.5, 'rgba(30, 10, 50, 0.1)'); 
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.beginPath(); ctx.arc(gw.x, gw.y, gw.r, 0, Math.PI*2);
                    ctx.fillStyle = grad; ctx.fill();
                    
                    // Event horizon ring
                    ctx.beginPath(); ctx.arc(gw.x, gw.y, gw.r * 0.15, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)'; ctx.lineWidth = 1; 
                    ctx.stroke();
                }

                // Draw Portals
                for(let p of portals) {
                    ctx.beginPath(); ctx.arc(p.in.x, p.in.y, p.in.r, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(212, 175, 55, 0.8)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.stroke();
                    
                    ctx.setLineDash([]);
                    ctx.beginPath(); ctx.arc(p.out.x, p.out.y, p.out.r, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 2; ctx.stroke();
                }

                ctx.globalCompositeOperation = 'source-over'; // Return to normal drawing

                // Draw Bombs (Optimized, removed heavy shadowBlur)
                for(let b of bombs) {
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 4, 0, Math.PI*2);
                    ctx.fillStyle = '#050202'; ctx.fill(); 
                    ctx.lineWidth = 1; ctx.strokeStyle = '#FF4D4D'; ctx.stroke();
                    
                    // Crosshair design
                    ctx.beginPath(); ctx.moveTo(b.x - b.r, b.y - b.r); ctx.lineTo(b.x + b.r, b.y + b.r);
                    ctx.moveTo(b.x + b.r, b.y - b.r); ctx.lineTo(b.x - b.r, b.y + b.r);
                    ctx.strokeStyle = 'rgba(212, 175, 55, 0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
                    
                    // Outer glow loop replacing shadowblur
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(255, 77, 77, 0.3)'; ctx.lineWidth = 4; ctx.stroke();
                }

                if(mods.clairvoyance && snake.history.length > 0) {
                    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(212, 175, 55, 0.15)';
                    food.forEach(f => {
                        ctx.beginPath(); ctx.moveTo(snake.x, snake.y); ctx.lineTo(f.x, f.y); ctx.stroke();
                    });
                }

                ctx.globalCompositeOperation = 'lighter';
                let pulse = Math.sin(frameCount * 0.08) * 3;

                // Fate Fragments (Food)
                for(let f of food) {
                    // Core
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
                    ctx.fillStyle = '#FFF8E7'; ctx.fill();
                    
                    // Aura Glow
                    let grad = ctx.createRadialGradient(f.x, f.y, f.r, f.x, f.y, f.r * 4 + pulse);
                    grad.addColorStop(0, 'rgba(244, 208, 104, 0.8)'); 
                    grad.addColorStop(1, 'rgba(212, 175, 55, 0)');
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 4 + pulse, 0, Math.PI*2); 
                    ctx.fillStyle = grad; ctx.fill();

                    if(mods.starlight) {
                        let sg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 150);
                        sg.addColorStop(0, 'rgba(255,255,255,0.1)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.beginPath(); ctx.arc(f.x, f.y, 150, 0, Math.PI*2); ctx.fillStyle = sg; ctx.fill();
                    }
                }

                // Illusions (False Food)
                for(let f of falseFood) {
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
                    ctx.fillStyle = '#FFAAAA'; ctx.fill();

                    let grad = ctx.createRadialGradient(f.x, f.y, f.r, f.x, f.y, f.r * 4 + pulse);
                    grad.addColorStop(0, 'rgba(255, 77, 77, 0.8)'); 
                    grad.addColorStop(1, 'rgba(155, 17, 30, 0)');
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 4 + pulse, 0, Math.PI*2); 
                    ctx.fillStyle = grad; ctx.fill();
                }

                // Particles (Optimized, removed shadowBlur)
                for (let p of particles) {
                    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, Math.random() * 2.5 + 1, 0, Math.PI * 2); ctx.fill();
                }
                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over';

                // Draw Edge Portals
                for (let i = edgePortals.length - 1; i >= 0; i--) {
                    let p = edgePortals[i];
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.shadowBlur = 15; // Kept here as there are only a couple at most at one time
                    ctx.shadowColor = '#D4AF37';
                    ctx.strokeStyle = '#D4AF37';
                    ctx.lineWidth = 3 + (1 - p.life) * 8;
                    
                    ctx.beginPath();
                    // Draw vertical portals on left/right walls, horizontal portals on top/bottom
                    if (p.isVertical) {
                        ctx.ellipse(p.x, p.y, 6 + (1 - p.life) * 5, 45 + (1 - p.life) * 20, 0, 0, Math.PI*2);
                    } else {
                        ctx.ellipse(p.x, p.y, 45 + (1 - p.life) * 20, 6 + (1 - p.life) * 5, 0, 0, Math.PI*2);
                    }
                    ctx.stroke();
                    
                    ctx.shadowColor = '#FFFFFF';
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.restore();
                    
                    // Keep the portal open while the snake is nearby (passing through)
                    let isNearSnake = false;
                    for (let pt of snake.history) {
                        if (Math.hypot(pt.x - p.x, pt.y - p.y) < 80) {
                            isNearSnake = true;
                            break;
                        }
                    }

                    if (isNearSnake) {
                        p.life = Math.min(1.0, p.life + 0.05);
                    } else {
                        p.life -= 0.035;
                    }
                    
                    if (p.life <= 0) edgePortals.splice(i, 1);
                }

                // Draw Ethereal Anchor Chain
                if (mods.anchored && snake.history.length > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(snake.history[0].x, snake.history[0].y);
                    ctx.lineTo(mods.anchored.x, mods.anchored.y);
                    ctx.strokeStyle = 'rgba(212, 175, 55, 0.3)';
                    ctx.setLineDash([8, 8]);
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    // Draw Anchor Point
                    ctx.beginPath();
                    ctx.arc(mods.anchored.x, mods.anchored.y, 8, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(212, 175, 55, 0.5)';
                    ctx.fill();
                    ctx.strokeStyle = '#D4AF37';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Cross mark over anchor
                    ctx.beginPath();
                    ctx.moveTo(mods.anchored.x - 4, mods.anchored.y - 4);
                    ctx.lineTo(mods.anchored.x + 4, mods.anchored.y + 4);
                    ctx.moveTo(mods.anchored.x + 4, mods.anchored.y - 4);
                    ctx.lineTo(mods.anchored.x - 4, mods.anchored.y + 4);
                    ctx.strokeStyle = '#FFF';
                    ctx.stroke();
                    ctx.restore();
                }

                // --- DRAW SNAKE (OPTIMIZED - Double stroke instead of ShadowBlur) ---
                if (snake.history.length > 0) {
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    // Determine colors based on states
                    let outerColor = 'rgba(244,208,104,0.3)';
                    let innerColor = '#F4D068';
                    
                    if (mods.invincibleFrames > 0) {
                        outerColor = (Math.floor(Date.now() / 100) % 2 === 0) ? 'rgba(255,255,255,0.4)' : 'rgba(212,175,55,0.3)';
                        innerColor = 'rgba(255,255,255,0.9)';
                    } else if (mods.etherealTailFrames > 0) {
                        outerColor = 'rgba(244,208,104,0.1)';
                        innerColor = 'rgba(244,208,104,0.4)';
                    }

                    // 1. Draw Outer Glow Layer
                    ctx.beginPath();
                    ctx.moveTo(snake.history[0].x, snake.history[0].y);
                    for (let i = 1; i < snake.history.length; i++) {
                        let pt = snake.history[i];
                        let prev = snake.history[i-1];
                        let dist = Math.hypot(pt.x - prev.x, pt.y - prev.y);

                        if (!mods.thick && !mods.invincibleFrames && mods.etherealTailFrames <= 0) {
                            ctx.globalAlpha = 1 - (i / snake.length) * 0.8; 
                        }
                        if (pt.wrapped || dist > 100) {
                            ctx.stroke(); ctx.beginPath(); ctx.moveTo(pt.x, pt.y);
                        } else {
                            ctx.lineTo(pt.x, pt.y);
                        }
                    }
                    ctx.strokeStyle = outerColor;
                    ctx.lineWidth = mods.thick ? 40 : 22;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;

                    // 2. Draw Inner Core Layer
                    ctx.beginPath();
                    ctx.moveTo(snake.history[0].x, snake.history[0].y);
                    for (let i = 1; i < snake.history.length; i++) {
                        let pt = snake.history[i];
                        let prev = snake.history[i-1];
                        let dist = Math.hypot(pt.x - prev.x, pt.y - prev.y);

                        if (!mods.thick && !mods.invincibleFrames && mods.etherealTailFrames <= 0) {
                            ctx.globalAlpha = 1 - (i / snake.length) * 0.8; 
                        }
                        if (pt.wrapped || dist > 100) {
                            ctx.stroke(); ctx.beginPath(); ctx.moveTo(pt.x, pt.y);
                        } else {
                            ctx.lineTo(pt.x, pt.y);
                        }
                    }
                    ctx.strokeStyle = innerColor;
                    ctx.lineWidth = mods.thick ? 26 : 12;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;

                    // Draw Head Indicator (Bright Core)
                    ctx.beginPath();
                    ctx.arc(snake.history[0].x, snake.history[0].y, mods.thick ? 10 : 6, 0, Math.PI*2);
                    ctx.fillStyle = '#050505'; ctx.fill();
                    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
                }

                // Fog Overlay (Optimized)
                if(mods.fog) {
                    let head = snake.history[0] || {x: GAME_W/2, y: GAME_H/2};
                    ctx.fillStyle = 'rgba(5,5,5,0.97)';
                    ctx.beginPath();
                    ctx.rect(0, 0, GAME_W, GAME_H);
                    ctx.arc(head.x, head.y, 220, 0, Math.PI*2, true); // `true` draws counter-clockwise to punch a hole
                    ctx.fill();
                }

                ctx.restore();
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            function resize() {
                const ratio = GAME_W / GAME_H;
                const windowRatio = window.innerWidth / window.innerHeight;
                if (windowRatio < ratio) {
                    canvas.style.width = '100vw'; canvas.style.height = `${window.innerWidth / ratio}px`;
                } else {
                    canvas.style.height = '100vh'; canvas.style.width = `${window.innerHeight * ratio}px`;
                }
            }
            window.addEventListener('resize', resize);
            resize();

            initGame(true); // Start AI loop
            requestAnimationFrame(loop);
        });
    </script>
</body>
</html>
